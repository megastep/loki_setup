name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '35 12 * * 2'

jobs:
  analyze:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          path: loki_setup
      - name: Read the SetupDB revision
        id: setupdb_revision
        working-directory: loki_setup
        shell: bash
        run: |
          revision=$(cat setupdb.rev)
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Record a full, published SetupDB commit SHA in setupdb.rev." >&2
            exit 1
          fi
          echo "sha=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: megastep/loki_setupdb
          ref: ${{ steps.setupdb_revision.outputs.sha }}
          path: loki_setupdb
      - uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake pkg-config libxml2-dev zlib1g-dev libncurses-dev libglade2-dev
      - name: Build SetupDB
        working-directory: loki_setupdb
        run: |
          ./autogen.sh
          ./configure --with-libxml2
          make -j2
      - name: Build and verify the installer
        working-directory: loki_setup
        run: |
          ./autogen.sh
          ./configure --enable-gtk2
          make -j2 all check loki_uninstall testcd testxml
          make install
          script -qec 'make smoke' /dev/null
      - uses: github/codeql-action/analyze@v4
